version: '3.8'

services:
  health-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NPM_TOKEN
    container_name: octopus_health_tracker
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - health_data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - JWT_SECRET=${JWT_SECRET:-octopus-shared-secret-change-in-production}
      - AUTH_SERVICE_URL=http://octopus-auth:3002
      - HEALTH_SERVICE_TOKEN=${HEALTH_SERVICE_TOKEN}
      # Recipes live in octopus-shopper (their ingredient list is the join key for
      # price lookups, which is shopper's job). Health reads them to log a meal
      # from a recipe; it does not own or copy them.
      - SHOPPER_URL=${SHOPPER_URL:-http://octopus_shopper_internal:3004}
      - SHOPPER_SERVICE_TOKEN=${SHOPPER_SERVICE_TOKEN}
    networks:
      - octopus_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  octopus_network:
    name: octopus_network
    external: true

volumes:
  health_data:
