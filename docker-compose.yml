version: '3.8'

services:
  health-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NPM_TOKEN
    container_name: octopus_health_tracker
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - health_data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - JWT_SECRET=${JWT_SECRET:-octopus-shared-secret-change-in-production}
      # This service verifies sessions LOCALLY with the shared secret, so it
      # needs the RSA public key to keep doing that once auth signs RS256.
      # Without it, every session is rejected here the moment auth switches.
      # A Portainer variable only interpolates into THIS file — a name absent
      # here never reaches the container, whatever the UI shows.
      - AUTH_PUBLIC_KEY=${AUTH_PUBLIC_KEY:-}
      - AUTH_SERVICE_URL=http://octopus-auth:3002
      - HEALTH_SERVICE_TOKEN=${HEALTH_SERVICE_TOKEN}
      # Recipes live in octopus-shopper (their ingredient list is the join key for
      # price lookups, which is shopper's job). Health reads them to log a meal
      # from a recipe; it does not own or copy them.
      - SHOPPER_URL=${SHOPPER_URL:-http://octopus_shopper_internal:3004}
      - SHOPPER_SERVICE_TOKEN=${SHOPPER_SERVICE_TOKEN}
      # USDA FoodData Central — free key from https://fdc.nal.usda.gov/api-key-signup
      # Without it, meals logged from a recipe record no macros (and say so) rather
      # than guessing. ~3,600 requests/hour, and matches are cached per ingredient
      # so a repeated recipe needs no calls at all.
      - FDC_API_KEY=${FDC_API_KEY:-}
    networks:
      - octopus_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  octopus_network:
    name: octopus_network
    external: true

volumes:
  health_data:
