version: '3.8'

services:
  health-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NPM_TOKEN
    container_name: octopus_health_tracker
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - health_data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      # Legacy HS256 secret — RETIRED. Empty on purpose; never give this a
      # default again, and never a working one.
      #
      # It used to read `${JWT_SECRET:-octopus-shared-secret-change-in-production}`,
      # a value published in the (then public) octopus-auth repo. Removing the
      # variable from Portainer to retire it therefore did not stop this service
      # trusting a shared secret — it started trusting a public one, and anyone
      # could mint a session for any user. This service holds a database per
      # user, so that was personal data for both accounts.
      #
      # Empty means auth-client skips the key. Verification is RS256 via
      # AUTH_PUBLIC_KEY below, which is confirmed set in the container.
      - JWT_SECRET=${JWT_SECRET:-}
      # This service verifies sessions LOCALLY with the shared secret, so it
      # needs the RSA public key to keep doing that once auth signs RS256.
      # Without it, every session is rejected here the moment auth switches.
      # A Portainer variable only interpolates into THIS file — a name absent
      # here never reaches the container, whatever the UI shows.
      - AUTH_PUBLIC_KEY=${AUTH_PUBLIC_KEY:-}
      # Make "sign out everywhere" mean something HERE.
      #
      # createAuthMiddleware() defaults to local mode, which checks a signature
      # and an expiry and nothing else. Revocation is a per-user tokenEpoch that
      # only octopus-auth knows, so a local check cannot see it: a revoked or
      # stolen session kept full access to these /api routes for the remaining
      # seven days of the token, and this service holds a database per user.
      # The estate found this on 2026-08-19 while acting on the JWT_SECRET
      # incident — the kill switch was being relied on without reaching here.
      #
      # Set to a literal 1, not ${AUTH_REMOTE_VERIFY:-1}. A variable that is
      # missing from Portainer must not be able to turn a security control off
      # quietly; that is precisely how JWT_SECRET became a public secret.
      #
      # Cost: one cached call to auth per token (60s TTL, so that is also the
      # revocation window), and these routes 401 while auth is down. Fail-closed
      # is deliberate — a revocation check that opens the gate when it cannot
      # reach the authority is not a revocation check — and the SSO cookie path
      # has always behaved this way, so auth being down already meant no login.
      - AUTH_REMOTE_VERIFY=1
      - AUTH_SERVICE_URL=http://octopus-auth:3002
      - HEALTH_SERVICE_TOKEN=${HEALTH_SERVICE_TOKEN}
      # Recipes live in octopus-shopper (their ingredient list is the join key for
      # price lookups, which is shopper's job). Health reads them to log a meal
      # from a recipe; it does not own or copy them.
      - SHOPPER_URL=${SHOPPER_URL:-http://octopus_shopper_internal:3004}
      - SHOPPER_SERVICE_TOKEN=${SHOPPER_SERVICE_TOKEN}
      # USDA FoodData Central — free key from https://fdc.nal.usda.gov/api-key-signup
      # Without it, meals logged from a recipe record no macros (and say so) rather
      # than guessing. ~3,600 requests/hour, and matches are cached per ingredient
      # so a repeated recipe needs no calls at all.
      - FDC_API_KEY=${FDC_API_KEY:-}
    networks:
      - octopus_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  octopus_network:
    name: octopus_network
    external: true

volumes:
  health_data:
